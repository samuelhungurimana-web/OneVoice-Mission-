<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="OneVoice Mission — Ijwi ry'Icyizere, Umucyo ku Buzima.">
<meta name="theme-color" content="#073b82">
<title>OneVoice Mission | Ijwi ry'Icyizere</title>

<style>
:root{
--navy:#062c68;
--blue:#0754a6;
--blue2:#0b70bd;
--gold:#ffbf16;
--ink:#14243b;
--muted:#607086;
--paper:#f5f8fd;
--white:#fff;
--line:#e4ebf4;
--shadow:0 14px 38px rgba(7,42,91,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:85px}
body{
font-family:Arial,sans-serif;
color:var(--ink);
background:var(--paper);
line-height:1.65;
}
a{text-decoration:none;color:inherit}
.container{width:min(1160px,92%);margin:auto}
.topbar{
background:#05295f;color:white;
padding:9px 0;font-size:14px;
}
.topbar .container{
display:flex;justify-content:space-between;
flex-wrap:wrap;gap:10px;
}
.topbar strong{color:#ffd04b}
header{
position:sticky;top:0;z-index:50;
background:white;
box-shadow:0 3px 18px rgba(0,0,0,.06);
}
.nav{
min-height:76px;
display:flex;align-items:center;
justify-content:space-between;gap:20px;
}
.brand{
display:flex;align-items:center;gap:10px;
color:var(--navy);font-weight:900;font-size:21px;
}
.logo{
width:45px;height:45px;border-radius:14px;
background:linear-gradient(145deg,#ffbf16,#fff0a8);
display:grid;place-items:center;font-size:27px;
}
.brand small{display:block;font-size:11px;color:var(--muted)}
.navlinks{
display:flex;align-items:center;gap:16px;
font-weight:bold;font-size:13px;
}
.navlinks a:hover{color:var(--blue2)}
.nav-cta,.btn{
display:inline-block;
padding:13px 21px;
border-radius:30px;
background:var(--gold);
color:#17233b;font-weight:bold;
}
.menu-btn{display:none}
.hero{
color:white;
background:
radial-gradient(circle at 80% 18%,rgba(255,194,42,.35),transparent 24%),
linear-gradient(120deg,#05265b,#0754a6 58%,#0a7a8a);
padding:85px 0;
}
.hero-grid{
display:grid;
grid-template-columns:1.15fr .85fr;
align-items:center;gap:35px;
}
.eyebrow{
display:inline-block;
background:rgba(255,255,255,.15);
padding:8px 15px;border-radius:30px;
}
.hero h1{
font-size:clamp(38px,6vw,72px);
line-height:1.05;margin:22px 0;
}
.hero h1 span{color:var(--gold)}
.hero-lead{font-size:19px;max-width:650px}
.hero-slogan{
color:#ffdc72;font-weight:bold;
margin-top:18px;
}
.hero-actions{
display:flex;gap:13px;
flex-wrap:wrap;margin-top:28px;
}
.btn-outline{
display:inline-block;
padding:12px 20px;
border:1px solid white;
border-radius:30px;color:white;
font-weight:bold;
}
.hero-art{
min-height:300px;
display:grid;place-items:center;
}
.sun{
width:270px;height:270px;
border-radius:50%;
background:linear-gradient(145deg,#ffe28b,#ffb91e);
display:grid;place-items:center;
color:var(--navy);font-size:100px;
box-shadow:0 0 0 18px rgba(255,255,255,.07);
}
section{padding:70px 0}
.section-head{
text-align:center;max-width:740px;
margin:0 auto 35px;
}
.kicker{
color:var(--blue2);
font-size:13px;font-weight:bold;
letter-spacing:2px;
}
.section-head h2{
font-size:36px;color:var(--navy);
margin:10px 0;
}
.section-head p{color:var(--muted)}
.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}
.card{
background:white;
border:1px solid var(--line);
border-radius:20px;
padding:27px;
box-shadow:var(--shadow);
}
.card-icon{
width:52px;height:52px;
border-radius:15px;
background:#eaf3ff;
display:grid;place-items:center;
font-size:26px;margin-bottom:15px;
}
.card h3{color:var(--navy);margin-bottom:9px}
.card p{color:var(--muted)}
.mission-band{background:#eaf2fc}
.mission-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:28px;align-items:center;
}
.mission-copy h2{
font-size:38px;color:var(--navy);
line-height:1.15;margin:12px 0;
}
.mission-copy p{color:var(--muted);margin-bottom:14px}
.promise{
background:linear-gradient(145deg,#07316f,#0868b5);
color:white;padding:35px;border-radius:25px;
}
.promise .quote{font-size:55px;color:var(--gold)}
.promise blockquote{font-size:23px;font-weight:bold}
